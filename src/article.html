<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} </title>
    <link rel="stylesheet" href="../css/style_blog.css">

     <!-- OGP -->
    <meta property="og:title" content= "{{ title ~ '|新・せかPの部屋' }}">
    <meta property="og:description" content="せかPの新しいホームページ。">
    <meta property="og:type" content="website">
    <meta property="og:url"
          content="https://appin-ac.github.io/timetable/index.html">
    <meta property="og:image"
          content="https://appin-ac.github.io/timetable/img/share.jpg">

    <!-- X（Twitter）向け -->
    <meta name="twitter:card" content="summary_large_image">
</head>

<body>
    <header class="header">
        <a href="../index.html" class="logo">
            <img src="../img/logo.svg" alt="seka.hp" id="index_head">
        </a>

        <nav>
            <ul class="nav">
                <li><a href="https://note.com/seka314">note</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <article>
            <h1>{{ title }}</h1>
            作成日：<time datetime="{{ date }}">{{ date | replace("-", ".")}}</time>
            <div class="article-body">
                {{ body | safe }}
            </div>
        </article>
    </main>

    <footer>
        <a href="../index.html">トップページへ戻る</a>
    </footer>
</body>

</html>
