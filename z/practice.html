<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>ページのタイトル</title>
    <link href="style.css" rel="stylesheet" type="text/css" media="all">
</head>

<body>
    <p>あ</p>
    <p>
<div class="tooltip-container">
  <span>ここに乗せてね</span>
  <div class="tooltip-text">詳細なメッセージがここに表示されます</div>
</div>
</p>

<style>
  /* 親要素の位置基準を設定 */
  .tooltip-container {
    position: relative;
    display: inline-block;
    cursor: pointer;
  }

  /* ツールチップ本体（通常時は非表示） */
  .tooltip-text {
    visibility: hidden;
    opacity: 0;
    width: 180px;
    background-color: #333;
    color: #fff;
    text-align: center;
    padding: 8px;
    border-radius: 4px;
    
    /* 表示位置の調整 */
    position: absolute;
    /*bottom: -200%;  親要素の上に配置 */
    left: 50%; 
    /* transform: translateX(50%); */
    
    /* アニメーション設定 */
    transition: opacity 0.3s, visibility 0.3s;
  }

  /* ホバーした時に表示 */
  .tooltip-container:hover .tooltip-text {
    visibility: visible;
    opacity: 1;
  }
</style>
</body>

</html>
